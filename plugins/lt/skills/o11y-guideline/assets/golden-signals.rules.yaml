# Regras Prometheus de referência dos 4 sinais de ouro para a skill o11y-guideline.
# Pressupõe a métrica estável http.server.request.duration exportada de OTLP para Prometheus
# (http_server_request_duration_seconds_*) e o label job vindo de service.name. Confirme os nomes
# no backend antes de usar: a tradução muda com exportador e versão (references/metrics.md).
# Os limiares são ponto de partida explícito; troque pelo objetivo ou baseline do serviço
# (references/alerting.md). A saturação usa cAdvisor e kube-state-metrics; troque pela fonte do
# recurso que satura primeiro no seu ambiente. Validar com: promtool check rules golden-signals.rules.yaml
groups:
  - name: golden-signals-recording
    interval: 30s
    rules:
      - record: job:http_server_requests:rate5m
        expr: sum by (job) (rate(http_server_request_duration_seconds_count[5m]))

      - record: job:http_server_errors:rate5m
        expr: sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))

      - record: job:http_server_error_ratio:rate5m
        expr: job:http_server_errors:rate5m / job:http_server_requests:rate5m

      - record: job:http_server_success_latency_seconds:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (job, le) (
              rate(http_server_request_duration_seconds_bucket{error_type=""}[5m])
            )
          )

      - record: job:http_server_error_latency_seconds:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (job, le) (
              rate(http_server_request_duration_seconds_bucket{error_type!=""}[5m])
            )
          )

  - name: golden-signals-alerts
    rules:
      - alert: HighErrorRatio
        expr: |
          job:http_server_error_ratio:rate5m > 0.05
          and on (job) job:http_server_requests:rate5m > 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Mais de 5% de erro 5xx em {{ $labels.job }}"
          description: "Razão de erro em {{ $value | humanizePercentage }} há 10 minutos, com tráfego acima de 1 req/s."

      - alert: HighSuccessLatencyP99
        expr: |
          job:http_server_success_latency_seconds:p99_5m > 1
          and on (job) job:http_server_requests:rate5m > 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "p99 de sucesso acima de 1 s em {{ $labels.job }}"
          description: "p99 das requisições com sucesso em {{ $value | humanizeDuration }} há 10 minutos."

      - alert: TrafficDrop
        expr: |
          job:http_server_requests:rate5m
          < 0.5 * job:http_server_requests:rate5m offset 1w
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Tráfego de {{ $labels.job }} abaixo da metade do mesmo horário da semana passada"
          description: "Tráfego atual em {{ $value | humanize }} req/s."

      - alert: HighMemorySaturation
        expr: |
          sum by (namespace, pod, container) (container_memory_working_set_bytes{container!=""})
          / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
          > 0.9
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Memória acima de 90% do limite em {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
          description: "Uso de memória em {{ $value | humanizePercentage }} do limite há 15 minutos."
