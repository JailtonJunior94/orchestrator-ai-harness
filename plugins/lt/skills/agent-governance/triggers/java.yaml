triggers:
  - ref: agent-governance/references/security.md
    patterns:
      - "Runtime.exec"
      - "ObjectInputStream"
      - "@PreAuthorize"
      - "XMLDecoder"
      - "ProcessBuilder"
  - ref: agent-governance/references/error-handling.md
    patterns:
      - "catch (Exception"
      - "e.printStackTrace()"
      - "throw new RuntimeException"
  - ref: agent-governance/references/testing.md
    patterns:
      - "@Test"
      - "mvn test"
      - "gradle test"
      - "junit"
  - ref: agent-governance/references/observability.md
    patterns:
      - "io.opentelemetry"
      - "micrometer"
  - ref: o11y-guideline/references/traces.md
    patterns:
      - "spanBuilder("
      - "recordException"
      - "setStatus("
  - ref: o11y-guideline/references/metrics.md
    patterns:
      - "counterBuilder("
      - "histogramBuilder("
