triggers:
  - ref: agent-governance/references/security.md
    patterns:
      - "os/exec"
      - "auth"
      - "password"
      - "token"
      - "http.Client"
      - "crypto"
      - "sql"
      - "deserializ"
  - ref: agent-governance/references/error-handling.md
    patterns:
      - "panic("
      - "recover("
      - "errors.New"
      - "_ ="
      - "err != nil"
  - ref: agent-governance/references/ddd.md
    patterns:
      - "internal/domain"
      - "entity"
      - "aggregate"
      - "value object"
  - ref: agent-governance/references/testing.md
    patterns:
      - "_test.go"
      - "coverage"
      - "TestMain"
  - ref: go-guideline/references/errors.md
    patterns:
      - "fmt.Errorf"
      - "errors.Is"
      - "errors.As"
      - "panic("
      - "log.Fatal"
      - "os.Exit"
  - ref: go-guideline/references/concurrency.md
    patterns:
      - "go func"
      - "sync.WaitGroup"
      - "errgroup"
      - "sync.Mutex"
      - "make(chan"
      - "atomic."
  - ref: go-guideline/references/context.md
    patterns:
      - "context.Context"
      - "WithCancel"
      - "WithTimeout"
  - ref: go-guideline/references/testing.md
    patterns:
      - "_test.go"
      - "t.Parallel()"
      - "t.Run("
  - ref: agent-governance/references/observability.md
    patterns:
      - "go.opentelemetry.io"
      - "log/slog"
      - "client_golang/prometheus"
  - ref: o11y-guideline/references/traces.md
    patterns:
      - "tracer.Start"
      - "RecordError"
      - "SetStatus("
  - ref: o11y-guideline/references/metrics.md
    patterns:
      - "Int64Counter"
      - "Float64Histogram"
      - "otel.Meter("
  - ref: o11y-guideline/references/go.md
    patterns:
      - "go.opentelemetry.io/otel"
