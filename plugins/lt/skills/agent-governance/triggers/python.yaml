triggers:
  - ref: agent-governance/references/security.md
    patterns:
      - "exec("
      - "pickle.loads"
      - "subprocess.shell=True"
      - "eval("
      - "yaml.load"
  - ref: agent-governance/references/error-handling.md
    patterns:
      - "except:"
      - "except Exception"
      - "raise"
      - "assert "
  - ref: agent-governance/references/testing.md
    patterns:
      - "test_"
      - "pytest"
      - "unittest"
      - "coverage"
  - ref: agent-governance/references/observability.md
    patterns:
      - "opentelemetry"
      - "structlog"
      - "prometheus_client"
  - ref: o11y-guideline/references/traces.md
    patterns:
      - "start_as_current_span"
      - "record_exception"
      - "set_status("
  - ref: o11y-guideline/references/metrics.md
    patterns:
      - "create_counter"
      - "create_histogram"
